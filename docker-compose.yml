name: mz-blog

services:

  mz-blog:
    image: mz-blog:latest
    container_name: mz-blog
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
      args:
        JAR_FILE: ${JAR_FILE:-deploy/mz-blog.jar}
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      DB_URL: "jdbc:mysql://${DB_HOST:-host.docker.internal}:${DB_PORT:-3306}/${DB_DATABASE:-mz_blog_cms}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true"
      DB_USERNAME: ${DB_USERNAME:?set DB_USERNAME in .env}
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      SITE_BASE_URL: ${SITE_BASE_URL:-http://localhost:8080}
      UPLOAD_ROOT: /data/uploads
      SERVER_SERVLET_SESSION_COOKIE_SECURE: ${COOKIE_SECURE:-false}
      SPRING_THYMELEAF_CACHE: "true"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - uploads:/data/uploads
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 40s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  uploads:
