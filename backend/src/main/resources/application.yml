server:
  port: 8080
  error:
    whitelabel:
      enabled: false
  servlet:
    session:
      timeout: 30m
      cookie:
        name: MZ_SESSION
        http-only: true
        same-site: lax
        secure: false

spring:
  application:
    name: mz-blog
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/mz_blog_cms?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root123}
    driver-class-name: com.mysql.cj.jdbc.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
  thymeleaf:
    cache: false
    encoding: UTF-8
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB
  jackson:
    time-zone: Asia/Shanghai
    date-format: yyyy-MM-dd HH:mm:ss
    serialization:
      write-dates-as-timestamps: false

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  site:
    base-url: ${SITE_BASE_URL:http://localhost:8080}
  storage:
    local:
      root: ${UPLOAD_ROOT:./data/uploads}
      public-prefix: /uploads
  security:
    login-failure-window-minutes: 15
    login-failure-limit: 5

logging:
  level:
    com.mz.blog: INFO
    org.springframework.security: WARN
