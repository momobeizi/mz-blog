<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<body>
<article class="post-card" th:fragment="card">
    <a class="post-cover" th:href="@{/articles/{slug}(slug=${article.slug})}">
        <img th:src="${article.coverUrl}" th:alt="${article.title}" loading="lazy">
        <span class="cover-shade"></span>
    </a>
    <div class="post-body">
        <div class="post-meta">
            <span th:text="${#strings.substring(article.publishedAt.toString(), 0, 10)}">2026-10-18</span>
            <span class="meta-dot"></span>
            <a th:href="@{/categories/{slug}(slug=${article.categorySlug})}" th:if="${article.categorySlug != null}" th:text="${article.categoryName}">分类</a>
            <span th:if="${article.categorySlug == null}" th:text="${article.categoryName}">分类</span>
        </div>
        <h3><a th:href="@{/articles/{slug}(slug=${article.slug})}" th:text="${article.title}">文章标题</a></h3>
        <p th:text="${article.summary}">摘要</p>
        <div class="post-foot">
            <span th:each="tag,stat : ${article.tagNames}" th:if="${stat.index < 2}" class="mini-tag" th:text="'#' + ${tag}"></span>
            <span class="read-arrow">阅读 →</span>
        </div>
    </div>
</article>
</body>
</html>
