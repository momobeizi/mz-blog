<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<body>
<nav class="pagination" th:fragment="pager(pageData)" th:if="${pageData.pages > 1}">
    <a th:if="${pageData.page > 1}" th:href="${paginationBase + '?page=' + (pageData.page - 1) + paginationQuery}" class="page-prev">← 上一页</a>
    <span class="page-info" th:text="${pageData.page + ' / ' + pageData.pages}">1 / 3</span>
    <a th:if="${pageData.page < pageData.pages}" th:href="${paginationBase + '?page=' + (pageData.page + 1) + paginationQuery}" class="page-next">下一页 →</a>
</nav>
</body>
</html>
